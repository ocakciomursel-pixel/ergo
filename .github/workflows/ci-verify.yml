name: CI Verify 1005
on:
  push:
    branches:
      - ci-test-1005
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - name: Run targeted tests
        run: sbt "testOnly org.ergoplatform.http.routes.WalletApiRouteSpec org.ergoplatform.http.routes.ScanApiRouteSpec org.ergoplatform.http.routes.ScriptApiRouteSpec org.ergoplatform.http.routes.MiningApiRouteSpec org.ergoplatform.nodeView.wallet.ErgoWalletSpec"
